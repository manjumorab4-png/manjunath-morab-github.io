<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manjunath Kallappa Morab — Geospatial &amp; Remote Sensing Professional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EAE6D9;
    --paper-deep: #DDD7C2;
    --ink: #1F2A1D;
    --ink-soft: #4A5643;
    --moss: #5C7031;
    --moss-deep: #46551F;
    --ochre: #A9723A;
    --line: #B9B29A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 920px; margin: 0 auto; padding: 0 32px; }
  a { color: var(--moss-deep); }

  h1, h2, h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    line-height: 1.15;
    color: var(--ink);
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
  }

  /* ---------- Nav ---------- */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(234, 230, 217, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  nav .wrap {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 16px; padding-bottom: 16px;
  }
  .nav-name { font-family: 'Fraunces', serif; font-size: 1.02rem; font-weight: 500; }
  .nav-links { display: flex; gap: 26px; list-style: none; flex-wrap: wrap; }
  .nav-links a {
    text-decoration: none; color: var(--ink); font-size: 0.88rem; position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; left: 0; bottom: -4px; width: 0; height: 1px;
    background: var(--moss); transition: width 0.25s ease;
  }
  .nav-links a:hover::after { width: 100%; }

  /* ---------- Hero ---------- */
  .hero { position: relative; padding: 100px 0 84px; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; z-index: 0; opacity: 0.5; }
  .hero-bg path {
    fill: none; stroke: var(--ink-soft); stroke-width: 1; opacity: 0.35;
    stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: draw 2.8s ease-out forwards;
  }
  .hero-bg path:nth-child(2) { animation-delay: 0.15s; }
  .hero-bg path:nth-child(3) { animation-delay: 0.3s; }
  .hero-bg path:nth-child(4) { animation-delay: 0.45s; }
  .hero-bg path:nth-child(5) { animation-delay: 0.6s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .hero-content {
    position: relative; z-index: 1; opacity: 0; transform: translateY(14px);
    animation: rise 0.8s ease-out 0.3s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .hero .coord { display: inline-block; margin-bottom: 20px; }
  .hero h1 { font-size: clamp(2.1rem, 5.2vw, 3.2rem); max-width: 16ch; }
  .hero .role { margin-top: 16px; font-size: 1.1rem; color: var(--ink-soft); max-width: 52ch; }
  .hero-actions { margin-top: 32px; display: flex; gap: 16px; flex-wrap: wrap; }

  .btn {
    display: inline-block; padding: 11px 20px; text-decoration: none; font-size: 0.92rem;
    border: 1px solid var(--ink); color: var(--ink); transition: background 0.2s ease, color 0.2s ease;
  }
  .btn-solid { background: var(--moss-deep); border-color: var(--moss-deep); color: var(--paper); }
  .btn-solid:hover { background: var(--ink); border-color: var(--ink); }
  .btn:not(.btn-solid):hover { background: var(--ink); color: var(--paper); }

  /* ---------- Section shell ---------- */
  section { padding: 68px 0; border-top: 1px solid var(--line); }
  .section-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 40px; flex-wrap: wrap; gap: 8px;
  }
  .section-head h2 { font-size: 1.75rem; }

  /* ---------- About ---------- */
  .about-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 52px; }
  .about-grid p { color: var(--ink-soft); max-width: 54ch; }
  .about-grid p + p { margin-top: 14px; }

  .skill-group + .skill-group { margin-top: 24px; }
  .skill-group .tag { display: block; margin-bottom: 10px; }
  .skill-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-list li {
    font-size: 0.84rem; padding: 6px 12px; border: 1px solid var(--line);
    background: var(--paper-deep); color: var(--ink);
  }

  /* ---------- Records (experience / projects) ---------- */
  .record {
    display: grid; grid-template-columns: 130px 1fr; gap: 22px;
    padding: 28px 0; border-bottom: 1px solid var(--line);
  }
  .record:first-of-type { padding-top: 0; }
  .record:last-of-type { border-bottom: none; }
  .record-meta-col { padding-top: 4px; }
  .record-meta-col .tag { display: block; }
  .record-meta-col .dates { display: block; margin-top: 6px; font-size: 0.72rem; color: var(--ink-soft); font-family: 'Space Mono', monospace; }

  .record h3 { font-size: 1.2rem; margin-bottom: 3px; }
  .record .org { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 12px; display: block; }
  .record ul { padding-left: 18px; color: var(--ink-soft); }
  .record ul li { margin-bottom: 6px; font-size: 0.94rem; }
  .record p { color: var(--ink-soft); max-width: 62ch; margin-bottom: 10px; }

  .record-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 12px; }
  .record-meta span {
    font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--ink-soft);
    border: 1px solid var(--line); padding: 3px 9px;
  }

  /* ---------- Maps gallery ---------- */
  .maps-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px;
  }
  .map-slot {
    aspect-ratio: 4 / 3;
    border: 1px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px;
    color: var(--ink-soft);
    background: var(--paper-deep);
  }
  .map-slot .plus { font-size: 1.6rem; font-family: 'Fraunces', serif; }
  .map-slot span.label { font-size: 0.78rem; text-align: center; padding: 0 12px; }

  .map-card {
    aspect-ratio: 4 / 3;
    border: 1px solid var(--line);
    background: var(--paper-deep);
    overflow: hidden;
    position: relative;
    cursor: zoom-in;
  }
  .map-card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform 0.35s ease;
  }
  .map-card:hover img { transform: scale(1.06); }
  .map-card figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(31,42,29,0.82), rgba(31,42,29,0));
    color: var(--paper);
    font-size: 0.76rem;
    padding: 22px 12px 10px;
  }

  .maps-note { margin-top: 22px; color: var(--ink-soft); font-size: 0.92rem; max-width: 62ch; }

  /* ---------- Lightbox ---------- */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(31,42,29,0.92);
    align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .lightbox-close {
    position: absolute; top: 20px; right: 28px; color: var(--paper);
    font-size: 2rem; cursor: pointer; line-height: 1; font-family: 'Space Grotesk', sans-serif;
  }

  /* ---------- Education / Certifications ---------- */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 52px; }
  .edu-item + .edu-item { margin-top: 20px; }
  .edu-item h3 { font-size: 1.05rem; }
  .edu-item .org { display: block; color: var(--ink-soft); font-size: 0.9rem; margin-top: 2px; }
  .edu-item .dates { display: block; font-family: 'Space Mono', monospace; font-size: 0.72rem; color: var(--ink-soft); margin-top: 4px; }

  .cert-list { list-style: none; }
  .cert-list li {
    font-size: 0.92rem; color: var(--ink-soft); padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .cert-list li:last-child { border-bottom: none; }

  .contact-box { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap:
